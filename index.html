<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f8b">
<meta name="description" content="Apprendre l'anglais de voyage : cartes de vocabulaire, phrases à traduire, lecture du jour et situations à l'oral.">
<title>Roadtrip English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="stamp">✈</span>Roadtrip</div>
    <div class="spacer"></div>
    <div class="streak-pill" id="streakPill" title="Jours d'affilée">🔥 <span id="streakN">0</span></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Réglages">⚙️</button>
  </div>
</header>

<main class="wrap">
  <section class="view active" id="view-home"></section>
  <section class="view" id="view-cards"></section>
  <section class="view" id="view-translate"></section>
  <section class="view" id="view-grammar"></section>
  <section class="view" id="view-read"></section>
  <section class="view" id="view-speak"></section>
  <section class="view" id="view-test"></section>
</main>

<nav class="tabbar" aria-label="Navigation">
  <div class="wrap">
    <button class="tab active" data-tab="home"><span class="ico">🏠</span>Accueil</button>
    <button class="tab" data-tab="cards"><span class="ico">🃏</span>Cartes</button>
    <button class="tab" data-tab="translate"><span class="ico">✍️</span>Traduire</button>
    <button class="tab" data-tab="grammar"><span class="ico">📐</span>Grammaire</button>
    <button class="tab" data-tab="read"><span class="ico">📖</span>Lecture</button>
    <button class="tab" data-tab="speak"><span class="ico">🗣️</span>Parler</button>
  </div>
</nav>

<div id="modalRoot"></div>

<script src="data/vocab1.js"></script>
<script src="data/vocab2.js"></script>
<script src="data/vocab3.js"></script>
<script src="data/vocab4.js"></script>
<script src="data/vocab5.js"></script>
<script src="data/vocab6.js"></script>
<script src="data/phrases.js"></script>
<script src="data/phrases2.js"></script>
<script src="data/readings1.js"></script>
<script src="data/readings2.js"></script>
<script src="data/readings3.js"></script>
<script src="data/readings4.js"></script>
<script src="data/situations.js"></script>
<script src="data/situations2.js"></script>
<script src="data/extra.js"></script>
<script src="data/grammar1.js"></script>
<script src="data/grammar2.js"></script>
<script src="data/grammar3.js"></script>
<script src="data/placement.js"></script>
<script src="js/app.js"></script>
<script src="js/grammar.js"></script>
<script src="js/level.js"></script>
</body>
</html>
